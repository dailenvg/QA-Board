name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  # The suite is split across three runners, so no one of them runs into its timeout. Each shard
  # builds the demo, seeds its own Postgres and signs in (the `setup` project runs in every shard).
  e2e:
    name: End-to-end shard ${{ matrix.shard }} of ${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Accounts and shares live in Postgres; the e2e setup empties and seeds this throwaway one.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: squint
          POSTGRES_PASSWORD: squint
          POSTGRES_DB: squint_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squint -d squint_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://squint:squint@127.0.0.1:5432/squint_e2e
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The runner's apt mirror sometimes fails to serve an index file, which used to fail the whole
      # run. apt now retries each download itself, and the install is tried up to three times with
      # a growing pause, so a passing mirror hiccup costs seconds instead of a red build. A real
      # failure still fails the step after the third try.
      - name: Install Playwright Chromium and WebKit
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          for attempt in 1 2 3; do
            pnpm --filter @pinpoint/demo exec playwright install --with-deps chromium webkit && exit 0
            echo "::warning::Playwright install failed (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done
          exit 1

      # Streamed without turbo's prefix, so progress shows while the shard runs (a grouped log
      # shows nothing until the task ends) and the `github` reporter's annotations still parse.
      - name: Run Playwright (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        run: pnpm test:e2e --log-order=stream --log-prefix=none -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload the shard's blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/demo/blob-report
          retention-days: 1

  e2e-report:
    name: End-to-end report
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download the shards' blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: apps/demo/all-blob-reports
          merge-multiple: true

      - name: Merge them into one HTML report
        run: pnpm --filter @pinpoint/demo exec playwright merge-reports --reporter html ./all-blob-reports
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/demo/playwright-report
          retention-days: 14

  # One check under the suite's old name, so a required "End-to-end (Playwright)" check keeps
  # working: it fails unless every shard passed. It runs even when a shard is cancelled, so a
  # cancelled shard reads as a failure, never as a skipped (passing) check.
  e2e-result:
    name: End-to-end (Playwright)
    needs: [e2e, e2e-report]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every shard passed
        env:
          SHARDS: ${{ needs.e2e.result }}
          REPORT: ${{ needs.e2e-report.result }}
        run: |
          if [ "$REPORT" != "success" ]; then
            echo "::warning::The merged report job ended $REPORT, so the HTML report may be missing."
          fi
          if [ "$SHARDS" != "success" ]; then
            echo "::error::The e2e shards ended $SHARDS."
            exit 1
          fi
