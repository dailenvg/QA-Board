name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Accounts and shares live in Postgres; the e2e setup empties and seeds this throwaway one.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: squint
          POSTGRES_PASSWORD: squint
          POSTGRES_DB: squint_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squint -d squint_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://squint:squint@127.0.0.1:5432/squint_e2e
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The runner's apt mirror sometimes fails to serve an index file, which used to fail the whole
      # run. apt now retries each download itself, and the install is tried up to three times with
      # a growing pause, so a passing mirror hiccup costs seconds instead of a red build. A real
      # failure still fails the step after the third try.
      - name: Install Playwright Chromium
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          for attempt in 1 2 3; do
            pnpm --filter @pinpoint/demo exec playwright install --with-deps chromium && exit 0
            echo "::warning::Playwright install failed (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done
          exit 1

      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/demo/playwright-report
            apps/demo/test-results
          retention-days: 14
